<style id="possession-loading-style">
  /* Possession boot screen — demonic violet theme.
     Override Godot 4 default loading bar (gray native <progress>) with a
     dark purple background + magenta gradient fill and a soft glow so the
     bar reads cleanly in direct sunlight on a phone. */

  body {
    background-color: #08040c;
  }

  #status {
    background-color: #08040c !important;
  }

  #status-notice {
    color: #e9c8ff !important;
    text-shadow: 0 0 6px rgba(168, 32, 240, 0.9), 0 0 2px #000;
    font-family: monospace;
    font-weight: bold;
    font-size: 13px !important;
    letter-spacing: 0.5px;
  }

  /* Native <progress> element — the default in Godot 4.2 export. */
  progress#status-progress {
    appearance: none;
    -webkit-appearance: none;
    -moz-appearance: none;
    width: 60%;
    max-width: 380px;
    height: 18px;
    border: 2px solid #8a1bd6;
    border-radius: 6px;
    background-color: #1a0820;
    box-shadow:
      0 0 14px rgba(168, 32, 240, 0.7),
      inset 0 0 6px rgba(0, 0, 0, 0.6);
    overflow: hidden;
  }
  progress#status-progress::-webkit-progress-bar {
    background-color: #1a0820;
    border-radius: 4px;
  }
  progress#status-progress::-webkit-progress-value {
    background: linear-gradient(90deg, #4a0e5e 0%, #a020f0 50%, #d72660 100%);
    border-radius: 4px;
    box-shadow: 0 0 10px rgba(215, 38, 96, 0.7);
    transition: width 0.18s ease-out;
  }
  progress#status-progress::-moz-progress-bar {
    background: linear-gradient(90deg, #4a0e5e 0%, #a020f0 50%, #d72660 100%);
    border-radius: 4px;
  }

  /* Div-based variant (some Godot 4 templates use this instead). */
  #status-progress-outer,
  #status-progress[role="progressbar"] {
    background-color: #1a0820 !important;
    border: 2px solid #8a1bd6 !important;
    border-radius: 6px !important;
    box-shadow: 0 0 14px rgba(168, 32, 240, 0.7) !important;
  }
  #status-progress-inner {
    background: linear-gradient(90deg, #4a0e5e 0%, #a020f0 50%, #d72660 100%) !important;
    box-shadow: 0 0 10px rgba(215, 38, 96, 0.7) !important;
  }

  /* Indeterminate state — pulse instead of static gray. */
  progress#status-progress:indeterminate {
    animation: possession-pulse 1.6s ease-in-out infinite;
  }
  @keyframes possession-pulse {
    0%, 100% { box-shadow: 0 0 8px rgba(168, 32, 240, 0.4); }
    50%      { box-shadow: 0 0 22px rgba(215, 38, 96, 0.9); }
  }
</style>
