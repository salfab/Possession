name: CI/CD — Possession V1g

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Serialize per branch / PR / tag, and cancel in-progress runs when a newer
# commit is pushed. Without this, two pushes a few minutes apart produced
# two parallel workflows; if the older one finished its build last, it
# could overwrite the newer one's deploy on GitHub Pages.
# Tags get their own group (no cancellation across releases).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# All jobs share the same Godot version. Bump here to upgrade.
# Godot 4.3 ships a "no-threads" Web export variant — selected via
# variant/thread_support=false in export_presets.cfg — which produces a
# single-threaded WASM build. That removes the SharedArrayBuffer / COOP
# / COEP requirement and unblocks iOS Safari (the threaded WASM build
# crashed there with "Out of bounds memory access" in pthread workers).
env:
  GODOT_VERSION: "4.3"
  EXPORT_PRESET: "Web"
  EXPORT_DIR: "export"
  ARTIFACT_NAME: "possession-v1g-web"

jobs:
  # ---------------------------------------------------------------------------
  # 1. Run the rules engine tests headlessly.
  # ---------------------------------------------------------------------------
  test:
    name: Tests (rules engine)
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import project (generates GDScript class cache)
        run: |
          set -e
          # --editor --quit registers all class_name declarations in .godot/
          # so that subsequent --script runs can resolve them.
          # CardImages uses lazy loading (no preload()) so the editor exits cleanly.
          godot --headless --editor --path . --quit

      - name: Run rules engine tests
        shell: bash
        run: |
          set -eo pipefail
          godot --headless --path . --script res://scripts/cli/run_tests.gd 2>&1 | tee tests.log
          # Require at least one PASS line to confirm tests actually ran.
          grep -q "PASS" tests.log || { echo "::error::No test output — tests did not run."; exit 1; }
          # Fail if the summary line shows any FAIL.
          if grep -E "=== [0-9]+/[0-9]+ PASS, ([1-9][0-9]*) FAIL ===" tests.log > /dev/null; then
            echo "::error::Some tests failed."
            exit 1
          fi

      - name: Run UI regression tests (liturgy-banner tap path)
        shell: bash
        # Boots the Main scene headless and asserts the per-banner input
        # invariants (panel STOP, gui_input wired, children IGNORE, not covered)
        # so a future banner-art refactor can't silently kill banner taps again.
        run: |
          set -eo pipefail
          godot --headless --path . --script res://scripts/cli/run_ui_tests.gd 2>&1 | tee ui-tests.log
          grep -q "PASS" ui-tests.log || { echo "::error::No UI test output — UI tests did not run."; exit 1; }
          if grep -E "=== [0-9]+/[0-9]+ PASS, ([1-9][0-9]*) FAIL ===" ui-tests.log > /dev/null; then
            echo "::error::Some UI tests failed."
            exit 1
          fi

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: |
            tests.log
            ui-tests.log
          # Debug aid for the current run only — the 90-day default piles up
          # hundreds of logs and eats the 0.5GB Actions storage quota.
          retention-days: 1

  # ---------------------------------------------------------------------------
  # 2. Build the Web/HTML5 export.
  # ---------------------------------------------------------------------------
  build-web:
    name: Build Web/HTML5
    runs-on: ubuntu-22.04
    needs: test
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage export templates
        # The barichello image ships the templates at /root/.local/share/godot/...
        # Godot also looks under $HOME — make sure they're visible there.
        run: |
          set -e
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          cp -rn /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable/* \
                  ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/ || true

      - name: Export Web build
        run: |
          set -e
          mkdir -p ${EXPORT_DIR}
          godot --headless --path . --export-release "${EXPORT_PRESET}" ${EXPORT_DIR}/index.html
          # Sanity check — at least index.html, .wasm, .pck must be present.
          test -f ${EXPORT_DIR}/index.html
          test -f ${EXPORT_DIR}/index.wasm
          test -f ${EXPORT_DIR}/index.pck

      - name: Add Netlify _headers (COOP/COEP)
        run: |
          {
            echo '/*'
            echo '  Cross-Origin-Opener-Policy: same-origin'
            echo '  Cross-Origin-Embedder-Policy: require-corp'
          } > ${EXPORT_DIR}/_headers

      - name: Inject demonic-violet loading bar style
        # Replaces Godot's default gray <progress> with a dark purple bar +
        # magenta gradient fill + glow, for readability on phone screens
        # in direct sunlight. Goes in <head> so styles apply before the
        # loader becomes visible (no FOUC).
        run: |
          set -e
          # Insert the style block right before </head>
          awk -v style_file="web_assets/loading-style.html" '
            !inserted && /<\/head>/ {
              while ((getline line < style_file) > 0) print line
              close(style_file)
              inserted = 1
            }
            { print }
          ' "${EXPORT_DIR}/index.html" > "${EXPORT_DIR}/index.html.new"
          mv "${EXPORT_DIR}/index.html.new" "${EXPORT_DIR}/index.html"
          grep -q 'possession-loading-style' "${EXPORT_DIR}/index.html"

      - name: Install offline-cache service worker and PWA manifest
        # Force bash — the barichello container otherwise runs `run:` steps
        # under dash, which doesn't support the bash-isms we used here.
        shell: bash
        # The web build no longer needs Cross-Origin isolation since the
        # upgrade to Godot 4.3 nothreads (SAB-free), so the SW is now a
        # pure offline cache : it precaches html/js/wasm/pck/manifest on
        # install, serves them from cache on every fetch with stale-while-
        # revalidate, and uses a per-deploy cache name (token __SHA__
        # below substituted with the short SHA so each new build invalidates
        # the previous cache automatically).
        # The web app manifest gives the page enough metadata for the
        # browser's "Install / Add to home screen" prompt and for the
        # standalone-display mode once installed — that's what makes the
        # game playable airplane-mode-on on iPad once first cached.
        run: |
          set -e
          cp web_assets/manifest.json "${EXPORT_DIR}/manifest.json"
          # Bake the deploy SHA into the SW so each push gets its own
          # cache namespace ; the `activate` handler garbage-collects the
          # previous one.
          SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
          sed "s|__SHA__|${SHORT_SHA}|g" web_assets/sw.js > "${EXPORT_DIR}/sw.js"
          grep -q "possession-${SHORT_SHA}" "${EXPORT_DIR}/sw.js"
          # Register the SW + link the manifest at the start of <head>.
          sed -i -E 's|<head([^>]*)>|<head\1>\n<link rel="manifest" href="manifest.json">\n<meta name="theme-color" content="#4a0e5e">\n<script src="sw.js"></script>|' "${EXPORT_DIR}/index.html"
          grep -q 'sw.js' "${EXPORT_DIR}/index.html"
          grep -q 'manifest.json' "${EXPORT_DIR}/index.html"

      - name: Inject version banner + service worker reset button
        # Banner HTML/JS injecté dans <body> AVANT que Godot ne se charge.
        # Permet (1) de voir si le navigateur sert la dernière version (timestamp + SHA)
        # et (2) de désinscrire les service workers anciens d'un clic, sans avoir
        # accès aux outils développeur.
        run: |
          set -e
          TIMESTAMP=$(date -u +'%Y-%m-%d %H:%M UTC')
          SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
          # Render banner placeholders into a temp file
          sed -e "s|__SHA__|$SHA|g" -e "s|__TIMESTAMP__|$TIMESTAMP|g" \
              web_assets/version-banner.html > "${EXPORT_DIR}/_banner.html"
          # Insert the rendered banner right after the opening <body...> tag
          awk -v banner_file="${EXPORT_DIR}/_banner.html" '
            !inserted && /<body[^>]*>/ {
              print
              while ((getline line < banner_file) > 0) print line
              close(banner_file)
              inserted = 1
              next
            }
            { print }
          ' "${EXPORT_DIR}/index.html" > "${EXPORT_DIR}/index.html.new"
          mv "${EXPORT_DIR}/index.html.new" "${EXPORT_DIR}/index.html"
          rm -f "${EXPORT_DIR}/_banner.html"
          grep -q 'version-banner' "${EXPORT_DIR}/index.html"

      - name: Zip the build
        run: |
          set -e
          cd ${EXPORT_DIR}
          zip -r ../${ARTIFACT_NAME}.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_NAME }}.zip
          # ~90MB per push: at 14 days this alone blew the 0.5GB Actions
          # storage quota. The artifact is consumed by the deploy job in the
          # same run; 2 days leaves room to re-run a failed deploy.
          retention-days: 2

  # ---------------------------------------------------------------------------
  # 3. Deploy to itch.io via butler. Skipped on PRs and forks.
  # ---------------------------------------------------------------------------
  deploy-itch:
    name: Deploy to itch.io
    runs-on: ubuntu-22.04
    needs: build-web
    # Opt-in via repo variable ENABLE_ITCH=true (mirrors ENABLE_NETLIFY).
    if: |
      github.event_name != 'pull_request'
      && vars.ENABLE_ITCH == 'true'
      && github.repository_owner == 'salfab'
      && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}

      - name: Unzip build
        run: |
          mkdir -p web
          unzip -o ${ARTIFACT_NAME}.zip -d web

      - name: Install butler
        run: |
          set -e
          curl -L -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -o butler.zip -d butler
          chmod +x butler/butler
          ./butler/butler -V

      - name: Push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_USER: ${{ vars.ITCH_USER }}
          ITCH_GAME: ${{ vars.ITCH_GAME }}
          ITCH_CHANNEL: ${{ vars.ITCH_CHANNEL || 'web' }}
        run: |
          set -e
          if [ -z "$BUTLER_API_KEY" ]; then
            echo "::warning::BUTLER_API_KEY secret missing — skipping itch.io deploy."
            exit 0
          fi
          if [ -z "$ITCH_USER" ] || [ -z "$ITCH_GAME" ]; then
            echo "::warning::ITCH_USER / ITCH_GAME variables missing — skipping itch.io deploy."
            exit 0
          fi
          ./butler/butler push web "$ITCH_USER/$ITCH_GAME:$ITCH_CHANNEL" \
            --userversion "${GITHUB_SHA::7}"

  # ---------------------------------------------------------------------------
  # 4. GitHub Pages deploy. Activate by enabling Pages with source
  # "GitHub Actions" in the repo Settings.
  # ---------------------------------------------------------------------------
  deploy-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-22.04
    needs: build-web
    if: |
      github.event_name != 'pull_request'
      && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}

      - name: Unzip build
        run: |
          mkdir -p web
          unzip -o ${ARTIFACT_NAME}.zip -d web

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Auto-enable Pages on the repo if it isn't already, so the workflow
          # can self-bootstrap without a manual Settings → Pages click.
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  # ---------------------------------------------------------------------------
  # 5. Optional Netlify deploy. Opt-in via repo variable ENABLE_NETLIFY=true.
  # ---------------------------------------------------------------------------
  deploy-netlify:
    name: Deploy to Netlify
    runs-on: ubuntu-22.04
    needs: build-web
    if: |
      github.event_name != 'pull_request'
      && vars.ENABLE_NETLIFY == 'true'
      && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}

      - name: Unzip build
        run: |
          mkdir -p web
          unzip -o ${ARTIFACT_NAME}.zip -d web

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: ./web
          production-deploy: true
          deploy-message: "GitHub Actions ${{ github.sha }}"
          enable-pull-request-comment: false
          enable-commit-comment: false
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
